<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADI Promotion Revision</title>
<style>
:root{
  --bg:#16241c; --bg2:#1d2f24; --panel:#223829; --panel-line:#33513e;
  --chalk:#f3ede0; --chalk-dim:#c7d4c8; --muted:#8ea48f;
  --gold:#d8ab4f; --gold-dim:#a9843e;
  --good:#6fae6f; --good-bg:#1c3324;
  --bad:#c96a5a; --bad-bg:#3a1f1c;
  --radius:10px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--chalk); font-family:var(--sans);
  min-height:100%; -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f4f1e6; --bg2:#eae4d2; --panel:#fffdf7; --panel-line:#ddd3b8;
    --chalk:#20291f; --chalk-dim:#43503f; --muted:#6f7a68;
    --gold:#8a5b1e; --gold-dim:#6b4517;
    --good:#2f7a3c; --good-bg:#e3f1e2;
    --bad:#a23b2b; --bad-bg:#f7e2dd;
  }
}
:root[data-theme="dark"]{
  --bg:#16241c; --bg2:#1d2f24; --panel:#223829; --panel-line:#33513e;
  --chalk:#f3ede0; --chalk-dim:#c7d4c8; --muted:#8ea48f;
}
a{color:inherit;}
.wrap{max-width:640px; margin:0 auto; padding:28px 20px 40px; min-height:100%;}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0 0 6px;}
.eyebrow{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:15px; margin:0 0 2px;}
.title{font-size:26px; line-height:1.25;}
.sub{color:var(--chalk-dim); font-size:14.5px; line-height:1.5; margin:6px 0 0;}
.panel{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius);
  padding:18px 18px; margin-top:18px;
}
.rule{height:1px; background:var(--panel-line); margin:16px 0; border:none;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--panel-line); background:var(--bg2); color:var(--chalk);
  padding:12px 18px; border-radius:8px; font-size:15px; font-family:var(--sans);
  cursor:pointer; text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#20140a;}
.btn.block{width:100%;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4; cursor:default;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--panel-line); border-radius:20px; padding:9px 14px; font-size:14px;
  cursor:pointer; user-select:none; background:var(--bg2); color:var(--chalk-dim);
}
.chip.on{background:var(--gold); border-color:var(--gold); color:#20140a; font-weight:600;}
.chip .n{opacity:.65; margin-left:4px;}
.field-label{font-size:13.5px; color:var(--muted); margin:18px 0 8px; letter-spacing:.2px;}
.seg{display:flex; border:1px solid var(--panel-line); border-radius:8px; overflow:hidden;}
.seg button{flex:1; padding:10px; border:none; background:var(--bg2); color:var(--chalk-dim); font-size:14.5px; cursor:pointer;}
.seg button.on{background:var(--gold); color:#20140a; font-weight:600;}
.timer-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
.timer-row input[type=range]{flex:1; accent-color:var(--gold);}
select{
  background:var(--bg2); color:var(--chalk); border:1px solid var(--panel-line);
  border-radius:8px; padding:10px 12px; font-size:14.5px; width:100%;
}
.progress-line{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:10px;}
.progress-bar{height:4px; background:var(--panel-line); border-radius:2px; overflow:hidden; margin-bottom:18px;}
.progress-fill{height:100%; background:var(--gold); transition:width .25s ease;}
.qtopic{font-size:12.5px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px;}
.qtext{font-size:19px; line-height:1.45; margin:0 0 18px; font-family:var(--serif);}
.preamble{
  font-size:14px; line-height:1.55; color:var(--chalk-dim); background:var(--bg2);
  border-left:3px solid var(--gold-dim); border-radius:0 8px 8px 0; padding:12px 14px; margin-bottom:14px;
}
.opt{
  display:flex; gap:12px; align-items:flex-start; padding:14px 14px; border:1px solid var(--panel-line);
  border-radius:8px; margin-bottom:10px; cursor:pointer; background:var(--bg2);
}
.opt .letter{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--panel-line);
  display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted);
}
.opt-text{font-size:15.5px; line-height:1.4; padding-top:2px;}
.opt.selected{border-color:var(--gold);}
.opt.selected .letter{background:var(--gold); color:#20140a; border-color:var(--gold);}
.opt.correct{border-color:var(--good); background:var(--good-bg);}
.opt.correct .letter{background:var(--good); color:#0d1f10; border-color:var(--good);}
.opt.incorrect{border-color:var(--bad); background:var(--bad-bg);}
.opt.incorrect .letter{background:var(--bad); color:#2a0f0b; border-color:var(--bad);}
.feedback{margin-top:14px; padding:14px; border-radius:8px; font-size:14.5px; line-height:1.5;}
.feedback.good{background:var(--good-bg); color:var(--good); border:1px solid var(--good);}
.feedback.bad{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad);}
.feedback .exp{color:var(--chalk-dim); margin-top:6px;}
.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
.nav-row .btn{flex:1;}
.clock{font-variant-numeric:tabular-nums; font-size:14px; color:var(--gold); border:1px solid var(--panel-line); border-radius:20px; padding:5px 12px;}
.clock.warn{color:var(--bad); border-color:var(--bad);}
.score-big{font-family:var(--serif); font-size:56px; margin:6px 0 2px;}
.score-sub{color:var(--chalk-dim); font-size:15px;}
.stat-row{display:flex; gap:10px; margin-top:16px;}
.stat{flex:1; background:var(--bg2); border:1px solid var(--panel-line); border-radius:8px; padding:12px; text-align:center;}
.stat .v{font-size:20px; font-weight:600;}
.stat .l{font-size:12px; color:var(--muted); margin-top:2px;}
.review-item{border:1px solid var(--panel-line); border-radius:8px; padding:14px; margin-top:10px; background:var(--bg2);}
.review-item .rq{font-size:15px; margin-bottom:8px;}
.review-item .ra{font-size:13.5px; line-height:1.5;}
.review-item .ra.you-wrong{color:var(--bad);}
.review-item .ra.you-right{color:var(--good);}
.review-item .exp{color:var(--chalk-dim); font-size:13.5px; margin-top:6px;}
.hidden{display:none !important;}
.top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.link-btn{background:none; border:none; color:var(--muted); font-size:13.5px; cursor:pointer; text-decoration:underline; padding:4px;}
.resume-banner{background:var(--bg2); border:1px solid var(--gold-dim); border-radius:8px; padding:14px; margin-bottom:18px; font-size:14px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const QUESTIONS_RAW = [{"topic": "ges", "type": "mcq", "q": "Which of the following is NOT a value of the educational sector?", "options": ["Accountability and Transparency", "Efficient Management of Resources", "Financial Resource Inflows", "Quality Education"], "correct": 2, "exp": "The educational sector's core values are accountability, efficient resource management, and quality education \u2014 not financial inflows.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "What is the core mandate of the Ghana Education Service?", "options": ["To develop national curriculum on education to be implemented by the Ministry of Education", "To formulate approved national policies and programmes on education", "To implement approved national policies and programmes on education", "To prepare approved salary structure for teachers for the Ministry of Education"], "correct": 2, "exp": "The Ministry of Education (MOE) formulates policy; GES implements approved policy at the pre-tertiary level.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The governing body of the Ghana Education Service is the:", "options": ["Directors of Education", "Ghana Education Service Council", "The Director-General of Ghana Education Service", "The Ghana Education Service Headquarters"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Distinguish between Scheme of Work (S) and Terms and Conditions of Service (T).", "options": ["S refers to classroom teachers' job description while T refers to contract of appointment regulating teachers' compensation, progression, work ethics, discipline, etc.", "S refers to contract of appointment which regulates the relationship between GES and teachers while T refers to classroom teachers' job description based on the syllabus.", "S refers to the syllabus while T refers to contract of appointment which regulates the relationship between GES and teachers", "S refers to classroom teachers' job description while T refers to the code of conduct for teachers."], "correct": 2, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The only apex disciplining authority with power to endorse a recommendation to summarily dismiss teaching and non-teaching personnel from GES is the:", "options": ["Board of Governors", "Director-General of GES", "GES Council", "Ministry of Education"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The Ghana Education Trust Fund (GETFUND) provides support mainly in the area of:", "options": ["administration expenses", "assets and investment expenditure", "compensation of employees", "goods and services"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which of the following is NOT a specific duty of the Ghana Education Service?", "options": ["Develop educational policies and programmes", "Maintain professional standards and the conduct of personnel", "Register teachers and keep an up-to-date register of all teachers in the public system", "Register, supervise and inspect Private Pre-Tertiary Educational institutions"], "correct": 0, "exp": "Developing/approving national policy is the Ministry of Education's role; GES implements approved policy.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The GES Governance System is made up of the following, EXCEPT:", "options": ["GES Council", "National Council of Deputy Directors", "The Director-General's Secretariat", "District Directorates"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "On the District Education Oversight Committee (DEOC), the District Director serves as the:", "options": ["Chairman", "Secretary", "Public Relations Officer", "Vice-Chairman"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which of the following is NOT a member of the School Management Committee (SMC)?", "options": ["One member appointed by the District Assembly", "The Headteacher", "Chairman of Sub-Committee responsible for Education", "One member appointed by the Town/Village"], "correct": 2, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which Education Act merged the National Accreditation Board (NAB) and National Council for Tertiary Education (NCTE) into a new regulatory body?", "options": ["Act 778 of 2008", "Act 506 of 1995", "Act 1023 of 2020", "Act 87 of 1961"], "correct": 2, "exp": "The Education Regulatory Bodies Act, 2020 (Act 1023) merged NAB and NCTE to form the Ghana Tertiary Education Commission (GTEC).", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which Education Act abolished racially segregated schools and introduced non-fee-paying schools?", "options": ["The Education Act of 1966", "The Education Act of 2008", "The Education Act of 1995", "The Education Act of 2020"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "A university is an institution designed for advanced instruction and research, conferring degrees in various faculties. Which body issues this classification?", "options": ["National Schools Inspectorate Authority (NaSIA)", "National Accreditation Board (NAB)", "National Council for Tertiary Education (NCTE)", "Ministry of Education (MOE)"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "What is the primary purpose of establishing a School Management Committee (SMC)? To help:", "options": ["Ensure greater participation in governance by the directorates at the basic level", "Ensure greater stakeholder participation in governance at the basic level", "Improve governance at the high level", "Improve governance at the primary school level"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The Education Regulatory Bodies Act, 2020 (Act 1023) is an Act that:", "options": ["Establishes the Commission for Technical and Vocational Education and Training", "Establishes the complementary Education Service Agency", "Merges the Ghana Education Service and Ghana Tertiary Education Commission", "Merges the National Teaching Council and National Council for Curriculum and Assessment (NaCCA)"], "correct": 0, "exp": "Act 1023 restructured several education regulatory bodies, including establishing the Commission for TVET and creating GTEC (from merging NAB/NCTE).", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which of the following is NOT a function of the National Teaching Council (NTC)?", "options": ["Accredit institutions offering teacher education and development programmes", "Issue licence and accreditation to pre-tertiary institutions in Ghana", "Issue temporary certification to unqualified persons who desire to teach", "Provide a framework for the development of teacher education curriculum"], "correct": 2, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "Which of the following is NOT an agency under the Ministry of Education?", "options": ["National Council for Curriculum and Assessment", "National Teaching Council", "National Schools Inspectorate Authority", "Noguchi Memorial Institute for Medical Research"], "correct": 3, "exp": "Noguchi is under the Ministry of Health, not the Ministry of Education.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "mcq", "q": "The five principles of Leadership for Learning include all of the following, EXCEPT:", "options": ["a focus on learning", "equality and equity", "learning dialogue", "shared accountability"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The District Education Oversight Committee (DEOC) is a structure to facilitate community participation in education.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The Capitation Grant was introduced in basic schools to remove fees as a barrier to access to education.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "One objective of the 2008 Education Reform Programme is to enhance education sector management and budgeting procedures.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "An attribute of good governance in GES is non-delegation of management control of an institution.", "options": ["True", "False"], "correct": 1, "exp": "Good governance involves appropriate delegation, not withholding it.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The core function of the Ghana Education Service is to formulate approved structure and content of education in the country.", "options": ["True", "False"], "correct": 1, "exp": "That is the Ministry of Education's role; GES implements approved policy.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The Ghana Education Service Act, 2008 (Act 778) is the current Act governing the Ghana Education Service.", "options": ["True", "False"], "correct": 1, "exp": "The Education Act, 2020 (Act 1049) took full effect from January 2022, overriding Act 778.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "A school's 'informal organization' refers to the structure of extra-curricular activities.", "options": ["True", "False"], "correct": 1, "exp": "Informal organization refers to unofficial relationships and networks within the school, not extra-curricular structure.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Giving teachers the authority and responsibility to apply their own professional knowledge in their area of responsibility is an important aspect of collegiality.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "As far as the Ghana Education Service is concerned, there are two major laws/regulations: the Ghana Education Service Act 1995 (Act 506) and the Education Act 2008 (Act 778).", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The bodies under the Ministry of Education are termed 'agencies' whilst the bodies under the Ghana Education Service are termed 'Units'.", "options": ["True", "False"], "correct": 1, "exp": "They are termed Divisions, not Units.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Vision may be explained as a target or an objective aimed at to help achieve a strategic result.", "options": ["True", "False"], "correct": 1, "exp": "That description fits a Goal, not a Vision.", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "When applying to GES for approval to embark on an excursion with pupils, GES policy does not allow night travel; pupil movement should take place between 6am and 6pm.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Tax evasion is criminal and punishable by law.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Decolonisation, which ensures freeing all African states from colonial rule, is an objective of the Organisation of African Unity (OAU).", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The Coalition of Heads of Basic Schools are members of the District Disciplinary Committee.", "options": ["True", "False"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Without principles of management being in place, an organization would have trouble achieving its aims, or even coming up with aims in the first place.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The practical difference between Educational Management and Educational Administration is that 'administration' is generally used in government organisations and 'management' is used in business organisations.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "All teaching personnel have their anniversary dates as their incremental date.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Maternity leave is added to a female teacher's annual leave entitlement if requested.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Physically challenged teachers are entitled to a Physically Challenged Transport Allowance which is 20% of their monthly basic salary.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Occupational injury or disease does NOT fall within the other conditions of work as determined by the Joint Negotiating Committee (10 persons each from Government and Unions).", "options": ["True", "False"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "When a teacher is convicted of a criminal offence and imprisoned, they would be re-engaged into the service after fully serving and being discharged from the prison sentence.", "options": ["True", "False"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The Early Grade Reading Assessment (EGRA) is an individually administered oral assessment of the most basic foundation skills for literacy acquisition in early grades.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "If a teacher is well paid, even without supervision, he/she can deliver very well.", "options": ["True", "False"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "The Fair Wages and Salaries Commission was established by Act 2007, (Act 737).", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "Human Resource Management, Logistics & Supplies, and Finance & Administration are under the Deputy Director-General (Quality and Access).", "options": ["True", "False"], "correct": 1, "exp": "They are under the Deputy Director-General (Management and Services).", "group": null, "preamble": null, "order": 0}, {"topic": "ges", "type": "tf", "q": "MOE formulates National Educational Policies at all levels whilst GES implements approved MOE policies at all levels.", "options": ["True", "False"], "correct": 1, "exp": "GES implements approved policies only at the pre-tertiary level.", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "Under the new primary school curriculum reform, 'standard-based curriculum' means:", "options": ["Pupils shall demonstrate understanding and mastery of knowledge and skills as they progress in their education", "Pupils shall demonstrate understanding and mastery of knowledge and skills through a standard examination or assessment", "A standard assessment system to provide sufficient data to help fashion improvement in teaching and learning", "There shall be a National Assessment at P2, P4 and P6 to track children's performance"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "A test that measures a student's knowledge or skill in relation to a curriculum standard is:", "options": ["criterion-referenced", "issue-referenced", "norm-referenced", "textbook-referenced"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "Which of the following is best produced by a norm-referenced test?", "options": ["Determination of whether students are performing at grade level, compared to peers", "Mastery of specific objectives in the curriculum", "Mastery of specific skills related to the curriculum", "All of the above"], "correct": 0, "exp": "Norm-referenced tests compare a student's performance to that of peers/a norm group. Mastery of specific curriculum objectives/skills is what criterion-referenced tests measure.", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "A/An ______ is an instrument used for measuring a sample of behaviour.", "options": ["Assessment", "Evaluation", "Measurement", "Test"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "Which of the following processes is limited to quantitative description of a pupil's performance?", "options": ["Assessment", "Evaluation", "Measurement", "Test"], "correct": 2, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "The purpose of evaluation is to make ______ about students.", "options": ["decision", "judgment", "opinion", "prediction"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "Evaluation is done to make judgment about the ______ of education.", "options": ["age", "quality", "quantity", "time period"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "The type of evaluation that monitors learning progress is ______ evaluation.", "options": ["diagnostic", "formative", "placement", "summative"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "A formal and systematic procedure of getting information about how much students have learnt is:", "options": ["assessment", "evaluation", "measurement", "test"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "The purpose of evaluation in education is to:", "options": ["assign a mark or score in a subject", "measure the achievement of students", "test the student in a subject", "make judgement about the quality of learning"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "The best possible way of evaluating a student's performance is through:", "options": ["an on-going overall assessment throughout the year", "annual tests", "monthly tests", "weekly tests"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "End-of-term exams conducted in schools are largely:", "options": ["achievement tests", "aptitude tests", "intelligence tests", "standardized achievement tests"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "mcq", "q": "The tools of assessment are: I. Rubrics II. Curriculum Mapping III. Focus Groups IV. Portfolios V. Structured Interviews VI. Surveys. Wh ing gains in an academic year.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "tf", "q": "It is important to know the purpose of assessment before selecting an assessment approach.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "tf", "q": "Grades as indicators of what students have learned become tainted if non-academic factors are counted and included in the evaluation.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "curriculum", "type": "tf", "q": "One of the key learning objectives of SDG 4 is that the learner is able to recognize the intrinsic value of education and analyse and identify their own learning needs in their personal development.", "options": ["True", "False"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "Which of the following processes improve the quality of teaching and learning? I. Use of questioning, illustrations and demonstrations II. Creation of opportunities for all learners to express their views III. Encouragement of learner-initiated tasks through motivation IV. Effective class control by following established rules V. Use of appropriate procedures for assessing learners' work", "options": ["I, II and III only", "II and III only", "I, II, III and IV only", "I, II, III, IV and V"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "A teacher is to use appropriate methods, techniques and sound principles of teaching, such as: I. Building on past knowledge and positive reinforcement II. Providing guidance and practice before independent practice III. Motivating and sustaining pupils' interest IV. Involving each learner in the process V. Distributing evaluative questions evenly", "options": ["I, II and III only", "II and III only", "I, II, III and IV only", "I, II, III, IV and V"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "In a learner-centred school, which activity would the school head encourage?", "options": ["Parents to design the curriculum", "Students to design the curriculum", "Teachers to avoid tests and other assessments because they demoralize students", "Teachers to develop lesson plans that use existing knowledge to construct new knowledge"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "Which statement about student grouping is correct?", "options": ["Grouping should be done throughout the school day rather than selectively", "Heterogeneous grouping is preferable to homogeneous grouping", "Homogeneous grouping is preferable to heterogeneous grouping", "None of the above"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "Which of the following statements about cooperative learning is correct? Cooperative learning:", "options": ["is another term for ability grouping", "refers to learning contracts between teachers and parents", "stresses student cooperation rather than student competition", "refers to services delivered by joint service centres"], "correct": 2, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "The core element of cooperative learning is to:", "options": ["encourage contracts between teachers and parents", "foster student competition rather than student support", "promote ability groupings", "showcase the positive effects of interdependence"], "correct": 3, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "Effective teaching recommendations include: I. Presenting new material in small steps with learner room", "type": "mcq", "q": "Which of the following statements about discipline and punishment is correct?", "options": ["Discipline focuses on imposing controls and punishment focuses on promoting positive behaviour", "Discipline focuses on promoting positive behaviour and punishment focuses on imposing controls", "Discipline is the responsibility of the principal and punishment is the responsibility of the Superintendent", "Discipline is the responsibility of the superintendent and punishment is the responsibility of the principal"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "Teachers are advised that in matters of student discipline, students should:", "options": ["have a fair and impartial hearing", "have no recourse to appeal a decision", "present only the class teacher as a witness", "all of the above"], "correct": 0, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "A conflict matrix in relation to timetabling is designed to determine which of the following? Courses that:", "options": ["cannot be scheduled at any time", "cannot be scheduled at the same time", "teachers are unwilling to teach", "teachers cannot teach"], "correct": 1, "exp": "", "group": null, "preamble": null, "order": 0}, {"topic": "classroom", "type": "mcq", "q": "This observed strategy moves through sequential stages of:", "options": ["Focused instruction, collaborative learning, guided instruction, independent learning", "Focused instruction, guided instruction, collaborative learning, independent learning", "Guided instruction, focused instruction, collaborative learning, independent learning", "Guided instruction, independent learning, focused instruction, collaborative learning"], "correct": 1, "exp": "", "group": "grp1", "preamble": "A mentee teacher sitting in the class of the mentor observed that students were actively engaged in the learning process rather than j const TOPIC_NAMES = {
  ges: "GES Law & Governance",
  curriculum: "Curriculum & Assessment",
  classroom: "Classroom Management & Teaching",
  leadership: "School Leadership & Improvement",
  inclusive: "Inclusive Education & SEN",
  psychology: "Educational Psychology & Philosophy",
  research: "Research Methods",
  admin: "Administration & Professional Practice"
};

const QUESTIONS = QUESTIONS_RAW.map((q, i) => ({...q, id: i}));

const STORE_KEY = "adi_quiz_progress_v1";

function loadSave(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function writeSave(state){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function clearSave(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let state = null; // active round state
const app = document.getElementById("app");

function topicCounts(){
  const counts = {};
  QUESTIONS.forEach(q => counts[q.topic] = (counts[q.topic]||0)+1);
  return counts;
}

function renderSetup(){
  const counts = topicCounts();
  const saved = loadSave();
  const topics = Object.keys(TOPIC_NAMES).filter(t => counts[t]);

  let setupTopics = (setupTopics_g || topics.slice());
  let setupTimed = setupTimed_g;
  let setupLen = setupLen_g;
  let setupSecPerQ = setupSecPerQ_g;

  const poolSize = QUESTIONS.filter(q => setupTopics.includes(q.topic)).length;
  const maxLen = Math.max(1, Math.min(60, poolSize));
  if(setupLen > poolSize) setupLen = Math.max(10, Math.min(setupLen, poolSize));

  app.innerHTML = `
    <div class="eyebrow">ADI Promotion Revision</div>
    <h1 class="title">Get ready to practise</h1>
    <p class="sub">${QUESTIONS.length} questions compiled from past promotion aptitude tests. Pick your topics, round length, and whether you want a clock running.</p>

    ${saved ? `
    <div class="resume-banner">
      You have a round in progress — question ${saved.currentIndex+1} of ${saved.order.length}, score so far ${saved.answers.filter(a=>a&&a.correct).length}/${saved.answers.filter(a=>a).length}.
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" id="resumeBtn">Resume round</button>
        <button class="btn ghost" id="discardBtn">Discard</button>
      </div>
    </div>` : ``}

    <div class="panel">
      <div class="field-label">Topics</div>
      <div class="row" id="topicChips">
        ${topics.map(t => `<div class="chip ${setupTopics.includes(t)?'on':''}" data-topic="${t}">${TOPIC_NAMES[t]}<span class="n">${counts[t]}</span></div>`).join("")}
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="link-btn" id="allTopics">Select all</button>
        <button class="link-btn" id="noneTopics">Clear</button>
      </div>

      <div class="field-label">Round length (${poolSize} question${poolSize===1?'':'s'} available)</div>
      <select id="lenSelect">
        ${[10,20,30,40,50].filter(n => n<=Math.max(10,poolSize) || n===10).map(n => `<option value="${n}" ${n===setupLen?'selected':''}>${Math.min(n,poolSize)} questions</option>`).join("")}
      </select>

      <div class="field-label">Timing</div>
      <div class="seg">
        <button class="${!setupTimed?'on':''}" data-timed="0">Untimed</button>
        <button class="${setupTimed?'on':''}" data-timed="1">Timed</button>
      </div>
      <div class="timer-row ${setupTimed?'':'hidden'}" id="timerRow">
        <span style="font-size:13.5px;color:var(--muted);white-space:nowrap;">${setupSecPerQ}s / question</span>
        <input type="range" min="15" max="90" step="5" id="secPerQ" value="${setupSecPerQ}">
      </div>

      <hr class="rule">
      <button class="btn primary block" id="startBtn">Start round</button>
    </div>
  `;

  document.querySelectorAll("#topicChips .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = chip.dataset.topic;
      const idx = setupTopics.indexOf(t);
      if(idx>=0){ if(setupTopics.length>1) setupTopics.splice(idx,1); }
      else setupTopics.push(t);
      setupTopics_g = setupTopics;
      renderSetup();
    });
  });
  document.getElementById("allTopics").onclick = () => { setupTopics_g = topics.slice(); renderSetup(); };
  document.getElementById("noneTopics").onclick = () => { setupTopics_g = [topics[0]]; renderSetup(); };
  document.getElementById("lenSelect").onchange = (e) => { setupLen_g = parseInt(e.target.value); };
  document.querySelectorAll("[data-timed]").forEach(b => {
    b.onclick = () => { setupTimed_g = b.dataset.timed === "1"; renderSetup(); };
  });
  const secInput = document.getElementById("secPerQ");
  if(secInput) secInput.oninput = (e) => { setupSecPerQ_g = parseInt(e.target.value); };

  document.getElementById("startBtn").onclick = () => {
    startRound(setupTopics, Math.min(setupLen, poolSize), setupTimed, setupSecPerQ);
  };

  if(saved){
    document.getElementById("resumeBtn").onclick = () => { state = saved; renderQuestion(); };
    document.getElementById("discardBtn").onclick = () => { clearSave(); renderSetup(); };
  }
}

let setupTopics_g = null;
let setupTimed_g = false;
let setupLen_g = 40;
let setupSecPerQ_g = 45;

function buildBlocks(filteredQuestions){
  // Groups (identified by q.group) must always stay together and in their
  // original order, preceded by their shared preamble - so we shuffle at the
  // block level, never splitting or reordering a group internally.
  const groups = {};
  const singles = [];
  filteredQuestions.forEach(q => {
    if(q.group){
      if(!groups[q.group]) groups[q.group] = [];
      groups[q.group].push(q);
    } else {
      singles.push([q]);
    }
  });
  Object.values(groups).forEach(g => g.sort((a,b) => a.order - b.order));
  return singles.concat(Object.values(groups));
}

function startRound(topics, length, timed, secPerQ){
  const filtered = QUESTIONS.filter(q => topics.includes(q.topic));
  const blocks = shuffle(buildBlocks(filtered));
  let order = [];
  for(const block of blocks){
    if(order.length >= length) break;
    order = order.concat(block.map(q => q.id));
  }
  state = {
    order, topics, timed, secPerQ,
    currentIndex: 0,
    answers: new Array(order.length).fill(null),
    remaining: timed ? secPerQ : null,
    finished: false
  };
  writeSave(state);
  renderQuestion();
}

function currentQuestion(){
  return QUESTIONS[state.order[state.currentIndex]];
}

function groupSize(groupId){
  return QUESTIONS.filter(q => q.group === groupId).length;
}

let tickHandle = null;
function stopTimer(){ if(tickHandle){ clearInterval(tickHandle); tickHandle=null; } }

function renderQuestion(){
  stopTimer();
  const q = currentQuestion();
  const total = state.order.length;
  const idx = state.currentIndex;
  const answer = state.answers[idx];
  const answered = !!answer;

  if(state.timed && !answered){
    state.remaining = state.secPerQ;
  }

  app.innerHTML = `
    <div class="top-actions">
      <button class="link-btn" id="exitBtn">&larr; Save &amp; exit</button>
      ${state.timed ? `<span class="clock" id="clock">${state.remaining}s</span>` : ``}
    </div>
    <div class="progress-line"><span>Question ${idx+1} of ${total}</span><span>Score ${state.answers.filter(a=>a&&a.correct).length}/${state.answers.filter(a=>a).length}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div>
    <div class="qtopic">${TOPIC_NAMES[q.topic] || q.topic}${q.group ? ` &middot; scenario question ${q.order+1} of ${groupSize(q.group)}` : ``}</div>
    ${q.preamble ? `<div class="preamble">${q.preamble}</div>` : ``}
    <div class="qtext">${q.q}</div>
    <div id="optsWrap"></div>
    <div id="feedbackWrap"></div>
    <div class="nav-row">
      <button class="btn" id="prevBtn" ${idx===0?'disabled':''}>Back</button>
      <button class="btn primary" id="nextBtn" ${answered?'':'disabled'}>${idx===total-1 ? 'Finish round' : 'Next'}</button>
    </div>
  `;

  renderOptions(q, answer);

  document.getElementById("prevBtn").onclick = () => { state.currentIndex--; writeSave(state); renderQuestion(); };
  document.getElementById("nextBtn").onclick = () => {
    if(idx === total-1){ finishRound(); } else { state.currentIndex++; writeSave(state); renderQuestion(); }
  };
  document.getElementById("exitBtn").onclick = () => { stopTimer(); writeSave(state); state=null; renderSetup(); };

  if(state.timed && !answered){
    const clockEl = document.getElementById("clock");
    tickHandle = setInterval(() => {
      state.remaining--;
      if(clockEl){
        clockEl.textContent = state.remaining + "s";
        if(state.remaining<=10) clockEl.classList.add("warn");
      }
      if(state.remaining<=0){
        stopTimer();
        selectOption(q, -1); // time up, no selection
      }
    }, 1000);
  }
}

function renderOptions(q, answer){
  const wrap = document.getElementById("optsWrap");
  const letters = ["A","B","C","D"];
  wrap.innerHTML = q.options.map((opt, i) => {
    let cls = "opt";
    if(answer){
      if(i === q.correct) cls += " correct";
      else if(i === answer.picked) cls += " incorrect";
    }
    return `<div class="opt ${cls}" data-i="${i}"><div class="letter">${letters[i]||i+1}</div><div class="opt-text">${opt}</div></div>`;
  }).join("");

  const fbWrap = document.getElementById("feedbackWrap");
  if(answer){
    const good = answer.picked === q.correct;
    fbWrap.innerHTML = `<div class="feedback ${good?'good':'bad'}">
      ${good ? "Correct." : (answer.picked===-1 ? "Time's up — no answer recorded." : "Not quite.")}
      ${!good ? ` The correct answer is <strong>${letters[q.correct]}</strong>.` : ""}
      ${q.exp ? `<div class="exp">${q.exp}</div>` : ""}
    </div>`;
  } else {
    fbWrap.innerHTML = "";
  }

  if(!answer){
    wrap.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => selectOption(q, parseInt(el.dataset.i));
    });
  } else {
    // allow changing the answer while still on this question
    wrap.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => selectOption(q, parseInt(el.dataset.i));
    });
  }
}

function selectOption(q, picked){
  stopTimer();
  state.answers[state.currentIndex] = { picked, correct: picked === q.correct };
  writeSave(state);
  renderQuestion();
  document.getElementById("nextBtn").disabled = false;
}

function finishRound(){
  stopTimer();
  state.finished = true;
  writeSave(state);
  renderSummary();
}

function renderSummary(){
  const total = state.order.length;
  const correctCount = state.answers.filter(a=>a && a.correct).length;
  const pct = Math.round((correctCount/total)*100);
  app.innerHTML = `
    <div class="eyebrow">Round complete</div>
    <h1 class="title">${pct}%</h1>
    <div class="score-big">${correctCount}/${total}</div>
    <div class="score-sub">correct answers</div>
    <div class="stat-row">
      <div class="stat"><div class="v">${state.answers.filter(a=>a && !a.correct).length}</div><div class="l">Missed</div></div>
      <div class="stat"><div class="v">${state.answers.filter(a=>a && a.picked===-1).length}</div><div class="l">Timed out</div></div>
    </div>
    <div class="row" style="margin-top:22px;">
      <button class="btn primary" id="reviewBtn">Review answers</button>
      <button class="btn" id="newRoundBtn">New round</button>
    </div>
  `;
  document.getElementById("reviewBtn").onclick = renderReview;
  document.getElementById("newRoundBtn").onclick = () => { clearSave(); state=null; renderSetup(); };
}

function renderReview(){
  const letters = ["A","B","C","D"];
  const items = state.order.map((qid, i) => {
    const q = QUESTIONS[qid];
    const a = state.answers[i];
    const you = a ? (a.picked===-1 ? "No answer (time up)" : letters[a.picked] + ". " + q.options[a.picked]) : "Not answered";
    return `<div class="review-item">
      <div class="qtopic">${TOPIC_NAMES[q.topic]||q.topic}</div>
      <div class="rq">${q.q}</div>
      <div class="ra ${a && a.correct ? 'you-right':'you-wrong'}">Your answer: ${you}</div>
      ${!(a && a.correct) ? `<div class="ra you-right">Correct answer: ${letters[q.correct]}. ${q.options[q.correct]}</div>` : ``}
      ${q.exp ? `<div class="exp">${q.exp}</div>` : ``}
    </div>`;
  }).join("");
  app.innerHTML = `
    <div class="eyebrow">Review</div>
    <h1 class="title">Every question, this round</h1>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="backSummary">Back to score</button>
      <button class="btn primary" id="newRoundBtn2">New round</button>
    </div>
    ${items}
  `;
  document.getElementById("backSummary").onclick = renderSummary;
  document.getElementById("newRoundBtn2").onclick = () => { clearSave(); state=null; renderSetup(); };
}

// init
(function init(){
  const saved = loadSave();
  if(saved && !saved.finished){
    // leave resume banner path to setup screen; don't auto-jump
  }
  renderSetup();
})();
</script>
</body>
</html>
